version: '3.8'

services:
  # 1. MongoDB Document Store
  mongodb:
    image: mongo:7.0
    container_name: documind-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - documind-network

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - documind-network

  # 3. Redis In-Memory Cache (SRS Section 59)
  redis:
    image: redis:7-alpine
    container_name: documind-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - documind-network

  # 4. Python FastAPI AI Service (OCR, LangGraph, Embeddings)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: documind-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=production
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=documind_documents
    depends_on:
      - qdrant
    networks:
      - documind-network

  # 5. Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/documind-ai
      - QDRANT_URL=http://qdrant:6333
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - qdrant
      - redis
      - ai-service
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - documind-network

  # 6. React Frontend Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: documind-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - documind-network

networks:
  documind-network:
    driver: bridge

volumes:
  mongo_data:
  qdrant_data:
  redis_data:
  backend_uploads:
