services:
  # =========================================================
  # 1. DOCUMIND-AI Node.js Backend API
  # =========================================================
  - type: web
    name: documind-ai-backend
    runtime: node
    rootDir: backend
    plan: standard
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: documind-ai-service
          property: host
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documind_documents
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: OPENROUTER_FAST_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documind-storage

  # =========================================================
  # 2. DOCUMIND-AI Python FastAPI AI Microservice
  # =========================================================
  - type: web
    name: documind-ai-service
    runtime: python
    rootDir: ai-service
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documind_documents
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: NODE_BACKEND_URL
        fromService:
          type: web
          name: documind-ai-backend
          property: host
      - key: FRONTEND_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: OPENROUTER_FAST_MODEL
        value: meta-llama/llama-3.1-8b-instruct
